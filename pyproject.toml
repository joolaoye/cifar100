[project]
name = "cifar100-study"
version = "0.0.0"
description = "Solo research harness for the CSCI 441 CIFAR-100 All-CNN-C study."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=1.26",
    "pyyaml>=6",
    "tensorflow>=2.16",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cifar100_study"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
