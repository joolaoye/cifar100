name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.12.7"
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Syntax check
        run: uv run python -m compileall -q src scripts tests

      - name: Config and unit tests
        run: uv run pytest

      - name: Entrypoint help
        run: |
          uv run python -m cifar100_study --help
          uv run python scripts/prepare.py --help
          uv run python scripts/train.py --help
          uv run python scripts/evaluate.py --help
          uv run python scripts/report.py --help
