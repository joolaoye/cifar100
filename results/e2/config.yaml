# Locked cifar100-allcnnc config e2. Complete file; do not inherit another config.
# Increased depth: stage extras [3, 3, 3], 350 epochs, milestones 200, 250, 300.

study: "cifar100-allcnnc"
experiment: "e2"

dataset:
  name: "cifar100"
  label_mode: "fine"
  num_classes: 100
  image_shape: [32, 32, 3]
  train_size: 50000
  test_size: 10000
  validation_split: 0
  augmentation: "none"
  label_encoding: "one_hot"

preprocessing:
  rescale_from: [0, 255]
  rescale_to: [0, 1]
  gcn: true
  gcn_min_divisor: 1.0e-8
  zca_whitening: true
  zca_form: "full"
  zca_regularization: 0.1
  covariance_divisor: "N"
  fit_on: "train"
  dtype: "float32"

model:
  architecture: "all-cnn-c"
  stage_extra_convolutions: [3, 3, 3]
  input_dropout: 0.2
  dropout_after_downsampler: 0.5
  initializer: "he_normal"

training:
  optimizer: "sgd"
  momentum: 0.9
  initial_learning_rate: 0.05
  lr_decay_factor: 0.1
  # Zero-indexed epoch at which the decayed learning rate applies.
  lr_milestone_convention: "zero_indexed_epoch"
  lr_milestones: [200, 250, 300]
  epochs: 350
  batch_size: 256
  l2_coefficient: 0.001
  loss: "categorical_crossentropy"
  seed: 42
  pretrained_weights: false
  early_stopping: false
  checkpoint_selection: "final_scheduled_epoch"

lifecycle:
  validation_driven_checkpoints: false
  run_deletion: false
  resumable: true
  history_reconciliation: true
  final_test_guard: "confirm-final-test"
  periodic_test_metrics: false
